# Offline tests (mocked AWS, no API keys) for each folder whose files changed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/test-paths.yml
      # every top-level key is a filter, including the anchor-only ones (common, qa_shared):
      # keep only keys that are folders with a Makefile
      - id: dirs
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          dirs=$(echo "$CHANGES" | jq -r '.[]' | while read -r d; do
            [ -f "$d/Makefile" ] && echo "$d"; done | jq -R . | jq -cs .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "testing: $dirs"

  test:
    needs: changes
    if: needs.changes.outputs.dirs != '[]' && needs.changes.outputs.dirs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
    name: test (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make -C "${{ matrix.dir }}" test
